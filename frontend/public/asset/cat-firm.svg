<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-firm" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#16A34A" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="firmQuilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="orthoBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="250" cy="275" rx="190" ry="25" fill="#0F172A" opacity="0.12"/>

  <!-- 3/4 Isometric Firm Ortho Mattress -->
  <g filter="url(#shadow-firm)">
    <!-- Base Core Side Left -->
    <path d="M60 170 L250 250 L250 270 L60 190 Z" fill="#475569"/>
    <!-- Base Core Side Right -->
    <path d="M250 250 L440 170 L440 190 L250 270 Z" fill="#334155"/>
    
    <!-- Firm Orthopedic Mattress Top Body -->
    <path d="M60 145 L250 225 L440 145 L250 65 Z" fill="url(#firmQuilt)" stroke="#BBF7D0" stroke-width="1.5"/>

    <!-- Taut Ortho Side Panel Left -->
    <path d="M60 145 L250 225 L250 175 L60 95 Z" fill="#DCFCE7" opacity="0.8"/>
    
    <!-- Firm Spine Care Accent Band Left -->
    <path d="M60 160 L250 240 L250 252 L60 172 Z" fill="url(#orthoBand)"/>
    <!-- Firm Spine Care Accent Band Right -->
    <path d="M250 240 L440 160 L440 172 L250 252 Z" fill="#166534"/>

    <!-- Firm Ortho Channel Tufting Lines (Spine Support Zones) -->
    <path d="M120 120 L280 184 M170 100 L330 164 M220 80 L380 144" stroke="#16A34A" stroke-width="2" opacity="0.5"/>

    <!-- Lumbar Support Zone Ribs -->
    <line x1="160" y1="183" x2="230" y2="153" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="190" y1="195" x2="260" y2="165" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="220" y1="207" x2="290" y2="177" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Heavy-Duty Reinforced Piping Edge -->
    <path d="M60 145 L250 225 L440 145" fill="none" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mellosoft Ortho Brand Tag -->
    <rect x="135" y="195" width="46" height="12" rx="3" fill="#FFFFFF" transform="skewY(23)"/>
    <text x="141" y="204" font-family="-apple-system, sans-serif" font-size="6" font-weight="900" fill="#15803D" transform="skewY(23)">ORTHO</text>
  </g>
</svg>
