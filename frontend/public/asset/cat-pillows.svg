<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-pillow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#E11D48" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="pillowFabric1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="pillowFabric2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Ground Soft Shadow -->
  <ellipse cx="250" cy="270" rx="170" ry="22" fill="#0F172A" opacity="0.14"/>

  <g filter="url(#shadow-pillow)">
    <!-- Bottom Pillow (Plush & Soft) -->
    <path d="M100 200 C80 180 120 140 250 140 C380 140 420 180 400 200 C380 220 380 240 250 245 C120 240 120 220 100 200 Z" fill="url(#pillowFabric2)" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M100 200 Q250 225 400 200" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>

    <!-- Top Stacked Pillow (Comfort Contour) -->
    <path d="M120 160 C100 135 140 90 260 90 C380 90 410 135 390 160 C370 185 360 200 260 205 C160 200 140 185 120 160 Z" fill="url(#pillowFabric1)" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Pillow Center Plush Indentation Contour -->
    <path d="M180 140 Q260 165 340 140" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <path d="M200 135 Q260 152 320 135" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Satin Piping Trim Edge -->
    <path d="M120 160 C140 185 160 200 260 205 C360 200 370 185 390 160" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Luxury Brand Label Corner -->
    <rect x="330" y="152" width="28" height="10" rx="2" fill="#E11D48" transform="rotate(-10 330 152)"/>
    <text x="344" y="159" font-family="-apple-system, sans-serif" font-size="5" font-weight="900" fill="#FFFFFF" text-anchor="middle" transform="rotate(-10 330 152)">MELLO</text>
  </g>
</svg>
