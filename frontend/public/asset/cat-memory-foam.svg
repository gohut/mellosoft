<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow-foam" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1B1F8C" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="topQuilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="sideAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B1F8C"/>
      <stop offset="100%" stop-color="#2E33A6"/>
    </linearGradient>
    <linearGradient id="baseFoam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="250" cy="275" rx="190" ry="25" fill="#0F172A" opacity="0.12"/>

  <!-- 3/4 Isometric Memory Foam Mattress -->
  <g filter="url(#shadow-foam)">
    <!-- Base Core Side Left -->
    <path d="M60 170 L250 250 L250 270 L60 190 Z" fill="#94A3B8"/>
    <!-- Base Core Side Right -->
    <path d="M250 250 L440 170 L440 190 L250 270 Z" fill="#64748B"/>
    
    <!-- Memory Foam Core Body -->
    <path d="M60 150 L250 230 L440 150 L250 70 Z" fill="url(#topQuilt)" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Quilted Layer Front Side -->
    <path d="M60 150 L250 230 L250 170 L60 90 Z" fill="#E2E8F0" opacity="0.6"/>
    
    <!-- Navy Blue Accent Band Left -->
    <path d="M60 160 L250 240 L250 252 L60 172 Z" fill="url(#sideAccent)"/>
    <!-- Navy Blue Accent Band Right -->
    <path d="M250 240 L440 160 L440 172 L250 252 Z" fill="#15186E"/>

    <!-- Mattress Top Diamond Quilting Pattern -->
    <path d="M110 128 L250 188 M160 106 L300 166 M210 84 L350 144 M260 62 L400 122" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M200 167 L60 107 M250 145 L110 85 M300 123 L160 63 M350 101 L210 41" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 3"/>

    <!-- Plush Piping Edge -->
    <path d="M60 150 L250 230 L440 150" fill="none" stroke="#1B1F8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mellosoft Brand Tag on Accent Band -->
    <rect x="135" y="195" width="45" height="12" rx="3" fill="#FFFFFF" transform="skewY(23)"/>
    <text x="141" y="204" font-family="-apple-system, sans-serif" font-size="6" font-weight="900" fill="#1B1F8C" transform="skewY(23)">MELLO</text>
  </g>
</svg>
