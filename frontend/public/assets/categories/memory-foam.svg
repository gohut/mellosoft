<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="drop-shadow-mf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
    
    <!-- Gradients for Memory Foam Mattress Cutout -->
    <linearGradient id="mf-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="mf-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="mf-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="foam-gel-layer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="foam-trans-layer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="foam-base-layer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow-mf)">
    <!-- Base Shadow Ellipse -->
    <ellipse cx="120" cy="152" rx="90" ry="14" fill="#0f172a" opacity="0.12" />

    <!-- 3D Mattress Isometric Model -->
    <!-- Side Right Face -->
    <path d="M 120 72 L 205 110 L 205 140 L 120 102 Z" fill="url(#mf-side)" />

    <!-- Front Left Face -->
    <path d="M 35 110 L 120 72 L 120 102 L 35 140 Z" fill="url(#mf-front)" />

    <!-- Foam Layer Stripes on Front Face -->
    <!-- Cool Gel Foam Layer -->
    <path d="M 35 110 L 120 72 L 120 79 L 35 117 Z" fill="url(#foam-gel-layer)" />
    <!-- Transition Layer -->
    <path d="M 35 117 L 120 79 L 120 89 L 35 127 Z" fill="url(#foam-trans-layer)" />
    <!-- Base Support Layer -->
    <path d="M 35 127 L 120 89 L 120 102 L 35 140 Z" fill="url(#foam-base-layer)" />

    <!-- Foam Layer Stripes on Side Face -->
    <path d="M 120 72 L 205 110 L 205 117 L 120 79 Z" fill="url(#foam-gel-layer)" opacity="0.85" />
    <path d="M 120 79 L 205 117 L 205 127 L 120 89 Z" fill="url(#foam-trans-layer)" opacity="0.85" />
    <path d="M 120 89 L 205 127 L 205 140 L 120 102 Z" fill="url(#foam-base-layer)" opacity="0.85" />

    <!-- Mattress Top Face -->
    <path d="M 120 32 L 205 70 L 120 108 L 35 70 Z" fill="url(#mf-top)" />

    <!-- Quilted Fabric Pattern Lines on Top Face -->
    <g stroke="#CBD5E1" stroke-width="1.2" opacity="0.6">
      <line x1="56" y1="60" x2="141" y2="98" />
      <line x1="77" y1="50" x2="162" y2="88" />
      <line x1="98" y1="40" x2="183" y2="78" />

      <line x1="77" y1="88" x2="162" y2="50" />
      <line x1="56" y1="78" x2="141" y2="40" />
      <line x1="98" y1="98" x2="183" y2="60" />
    </g>

    <!-- Quilt Buttons/Nodes -->
    <g fill="#94A3B8" opacity="0.7">
      <circle cx="120" cy="70" r="2" />
      <circle cx="99" cy="60" r="1.8" />
      <circle cx="141" cy="60" r="1.8" />
      <circle cx="120" cy="50" r="1.8" />
      <circle cx="120" cy="90" r="1.8" />
      <circle cx="78" cy="70" r="1.8" />
      <circle cx="162" cy="70" r="1.8" />
    </g>

    <!-- Piped Edge Border Stitching -->
    <path d="M 120 32 L 205 70 L 120 108 L 35 70 Z" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <path d="M 120 32 L 205 70 L 120 108 L 35 70 Z" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" />
  </g>
</svg>
