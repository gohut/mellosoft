<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow-hy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>

    <linearGradient id="hy-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>

    <linearGradient id="hy-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>

    <linearGradient id="hy-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <linearGradient id="coil-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow-hy)">
    <!-- Base Shadow Ellipse -->
    <ellipse cx="120" cy="152" rx="90" ry="14" fill="#0f172a" opacity="0.12" />

    <!-- Side Right Face -->
    <path d="M 120 72 L 205 110 L 205 140 L 120 102 Z" fill="url(#hy-side)" />

    <!-- Front Left Face -->
    <path d="M 35 110 L 120 72 L 120 102 L 35 140 Z" fill="url(#hy-front)" />

    <!-- Cutout Pocket Coil Visual Layer on Front Face -->
    <path d="M 35 118 L 120 80 L 120 95 L 35 133 Z" fill="#1E293B" opacity="0.95" />
    
    <!-- Pocket Coils (Spring Coils Illustration) -->
    <g stroke="url(#coil-grad)" stroke-width="2" fill="none">
      <path d="M 45 125 C 45 120, 52 120, 52 123 C 52 126, 45 126, 45 129" />
      <path d="M 60 118 C 60 113, 67 113, 67 116 C 67 119, 60 119, 60 122" />
      <path d="M 75 111 C 75 106, 82 106, 82 109 C 82 112, 75 112, 75 115" />
      <path d="M 90 104 C 90 99, 97 99, 97 102 C 97 105, 90 105, 90 108" />
      <path d="M 105 97 C 105 92, 112 92, 112 95 C 112 98, 105 98, 105 101" />
    </g>

    <!-- Top Cushion Foam Cap Layer -->
    <path d="M 35 110 L 120 72 L 120 80 L 35 118 Z" fill="#FFEDD5" opacity="0.9" />
    <path d="M 120 72 L 205 110 L 205 118 L 120 80 Z" fill="#FED7AA" opacity="0.9" />

    <!-- Top Mattress Surface -->
    <path d="M 120 32 L 205 70 L 120 108 L 35 70 Z" fill="url(#hy-top)" />

    <!-- Geometric Pillow-Top Quilting Lines -->
    <g stroke="#FDBA74" stroke-width="1.2" opacity="0.5">
      <path d="M 77.5 51 Q 120 70 162.5 89" fill="none" />
      <path d="M 56 60.5 Q 120 89 141 60.5" fill="none" />
      <path d="M 98.5 41.5 Q 120 51 183.5 79.5" fill="none" />
    </g>

    <g stroke="#EA580C" stroke-width="1" opacity="0.3">
      <line x1="120" y1="32" x2="120" y2="108" />
      <line x1="35" y1="70" x2="205" y2="70" />
    </g>

    <!-- Edge Piping -->
    <path d="M 120 32 L 205 70 L 120 108 L 35 70 Z" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <path d="M 120 32 L 205 70 L 120 108 L 35 70 Z" fill="none" stroke="#EA580C" stroke-width="1.5" opacity="0.7" />
  </g>
</svg>
