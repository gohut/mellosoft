<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow-fm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>

    <linearGradient id="fm-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>

    <linearGradient id="fm-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="fm-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow-fm)">
    <ellipse cx="120" cy="152" rx="90" ry="14" fill="#0f172a" opacity="0.12" />

    <!-- Side Right Face -->
    <path d="M 120 72 L 205 110 L 205 140 L 120 102 Z" fill="url(#fm-side)" />

    <!-- Front Left Face -->
    <path d="M 35 110 L 120 72 L 120 102 L 35 140 Z" fill="url(#fm-front)" />

    <!-- Firm Support Reinforcement Band on Front -->
    <path d="M 35 120 L 120 82 L 120 92 L 35 130 Z" fill="#022C22" opacity="0.4" />
    <path d="M 120 82 L 205 120 L 205 130 L 120 92 Z" fill="#022C22" opacity="0.5" />

    <!-- Ortho Badge Ribbon Indicator on Side -->
    <path d="M 150 96 L 175 107 L 175 122 L 150 111 Z" fill="#34D399" opacity="0.9" />

    <!-- Top Mattress Surface -->
    <path d="M 120 32 L 205 70 L 120 108 L 35 70 Z" fill="url(#fm-top)" />

    <!-- Firm Grid Stitch Pattern -->
    <g stroke="#6EE7B7" stroke-width="1" opacity="0.6">
      <line x1="63" y1="57" x2="148" y2="95" />
      <line x1="91" y1="44" x2="176" y2="82" />

      <line x1="63" y1="82" x2="148" y2="44" />
      <line x1="91" y1="95" x2="176" y2="57" />
    </g>

    <!-- Edge Piping -->
    <path d="M 120 32 L 205 70 L 120 108 L 35 70 Z" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <path d="M 120 32 L 205 70 L 120 108 L 35 70 Z" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.8" />
  </g>
</svg>
