<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow-pl" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>

    <linearGradient id="pl-top1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>

    <linearGradient id="pl-top2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>

    <linearGradient id="pl-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow-pl)">
    <!-- Base Shadow Ellipse -->
    <ellipse cx="120" cy="154" rx="85" ry="12" fill="#0f172a" opacity="0.12" />

    <!-- Back Pillow (Slightly behind, higher up) -->
    <g transform="translate(15, -15)">
      <path d="M 60 70 C 60 50, 110 35, 160 45 C 190 50, 200 70, 190 85 C 175 105, 115 110, 75 95 C 55 85, 60 75, 60 70 Z" fill="url(#pl-top2)" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.3" />
      <path d="M 60 70 C 80 85, 140 90, 190 85 C 195 92, 175 108, 75 95 C 55 85, 60 75, 60 70 Z" fill="url(#pl-shadow)" opacity="0.25" />
    </g>

    <!-- Front Main Plush Pillow -->
    <g transform="translate(-5, 10)">
      <!-- Main Pillow Cushion Surface -->
      <path d="M 45 75 C 45 52, 100 36, 165 48 C 200 55, 210 78, 195 95 C 175 118, 105 122, 60 105 C 40 95, 45 80, 45 75 Z" fill="url(#pl-top1)" />

      <!-- Pillow Side Seam / Gusset Contour -->
      <path d="M 45 75 C 70 95, 140 102, 195 95 C 198 103, 175 122, 60 105 C 40 95, 45 80, 45 75 Z" fill="url(#pl-shadow)" opacity="0.4" />

      <!-- Contour Comfort Wave Inset -->
      <path d="M 75 62 C 105 50, 145 54, 175 66 C 160 82, 115 88, 85 78 Z" fill="#FFFFFF" opacity="0.6" />

      <!-- Elegant Piping Trim -->
      <path d="M 45 75 C 45 52, 100 36, 165 48 C 200 55, 210 78, 195 95 C 175 118, 105 122, 60 105 C 40 95, 45 80, 45 75 Z" fill="none" stroke="#FB7185" stroke-width="1.8" opacity="0.8" />
    </g>
  </g>
</svg>
