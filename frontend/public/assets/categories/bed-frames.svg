<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow-bf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>

    <linearGradient id="headboard-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <linearGradient id="slat-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow-bf)">
    <ellipse cx="120" cy="154" rx="90" ry="12" fill="#0f172a" opacity="0.12" />

    <!-- Headboard Back Wall -->
    <path d="M 45 40 C 45 35, 50 30, 55 30 L 140 30 C 145 30, 150 35, 150 40 L 150 110 L 45 110 Z" fill="url(#headboard-grad)" />

    <!-- Headboard Tufting / Panels -->
    <g stroke="#A78BFA" stroke-width="1.2" opacity="0.5">
      <line x1="80" y1="30" x2="80" y2="110" />
      <line x1="115" y1="30" x2="115" y2="110" />
      <line x1="45" y1="70" x2="150" y2="70" />
    </g>

    <!-- Side Wooden Frame Panel -->
    <path d="M 150 95 L 210 120 L 210 135 L 150 110 Z" fill="url(#frame-grad)" />

    <!-- Front Footboard Frame Panel -->
    <path d="M 35 125 L 150 95 L 150 110 L 35 140 Z" fill="url(#frame-grad)" opacity="0.9" />

    <!-- Bed Slats Base (Isometric Wooden Slats) -->
    <g fill="url(#slat-wood)" opacity="0.85">
      <polygon points="55,108 65,105 160,117 150,120" />
      <polygon points="70,113 80,110 175,122 165,125" />
      <polygon points="85,118 95,115 190,127 180,130" />
    </g>

    <!-- Legs -->
    <polygon points="35,140 42,140 40,154 35,154" fill="#1E1B4B" />
    <polygon points="148,110 154,110 152,124 148,124" fill="#1E1B4B" />
    <polygon points="208,135 214,135 212,148 208,148" fill="#1E1B4B" />
  </g>
</svg>
